name: Whoami probe

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Installer lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Déposer des témoins avec les secrets ACTUELS
        env:
          HOST: ${{ secrets.FTP_HOST }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          printf 'ROOT'  > wai_root.txt
          printf 'PH'    > wai_ph.txt
          lftp -u "$USERNAME","$PASSWORD" "$HOST" <<'EOF'
          set ftp:ssl-allow no
          set net:timeout 20
          put wai_root.txt -o wai_root.txt
          mkdir -p public_html || true
          put wai_ph.txt -o public_html/wai_ph.txt
          bye
          EOF

name: Deploy to Hostinger (app-locus.com)

on:
  push:
    branches: [master]
  workflow_dispatch: # permet aussi un déclenchement manuel depuis l'onglet Actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Builder le site
        run: npm run build

      - name: Déployer sur Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Contenu du build à envoyer
          local-dir: ./dist/
          # Dossier racine du site sur Hostinger (voir note dans DEPLOIEMENT.md)
          server-dir: public_html/
          # Nettoie entièrement le dossier distant avant d'uploader le build
          # (supprime tout résidu : ancien clone source, fichiers orphelins, etc.)
          dangerous-clean-slate: true
